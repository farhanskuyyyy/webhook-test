services:
  hookdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/webhooks.db
      MAX_BODY_BYTES: "10485760"
      GEOIP_DB_PATH: /data/dbip-city-lite.mmdb
      GEOIP_AUTO_DOWNLOAD: "${GEOIP_AUTO_DOWNLOAD:-true}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    volumes:
      - webhook-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  webhook-data:
